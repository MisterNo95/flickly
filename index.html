<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Comprehension Map</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Language Comprehension</h1>
          <p>
            Select the languages you speak to see where at least 50% of the
            population can communicate with you.
          </p>
        </div>
        <div class="language-list" id="language-list"></div>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-swatch legend-eligible"></span>
            <span>≥ 50% comprehension</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch legend-ineligible"></span>
            <span>&lt; 50% comprehension</span>
          </div>
        </div>
      </aside>
      <main class="map-panel">
        <div class="map-header">
          <h2>World Map</h2>
          <p>Hover over a country to view language percentages.</p>
        </div>
        <div id="map" class="map"></div>
      </main>
    </div>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
