<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Flickly poster fallback</title>
  <desc id="desc">A decorative fallback poster used when a review image is missing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1320" />
      <stop offset="60%" stop-color="#2a1e35" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#bg)" />
  <rect x="70" y="70" width="660" height="1060" rx="24" fill="none" stroke="#d6a756" stroke-opacity="0.45" stroke-width="6"/>
  <text x="400" y="520" text-anchor="middle" fill="#f4ecde" font-size="66" font-family="Georgia, 'Times New Roman', serif">THE FLICKLY</text>
  <text x="400" y="600" text-anchor="middle" fill="#d6a756" font-size="40" letter-spacing="4" font-family="Arial, sans-serif">REVIEW POSTER</text>
  <text x="400" y="670" text-anchor="middle" fill="#b8a8c8" font-size="28" font-family="Arial, sans-serif">Image unavailable</text>
</svg>
